<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css">
  <title>The Lonely Dataset</title>
</head>

<body>
  <!-- Landing Page -->
  <main class="full-page-bg home-page">
    <div class="container h-100 d-flex justify-content-center align-items-center">

      <!-- Hero -->
      <div class="p-5 mb-4 bg-body-tertiary rounded-3 text-center w-100">
        <div class="container-fluid py-5 hero rounded-3">
          <h1 class="display-3 fw-bold">The Lonely File</h1>
          <h2 class="col-md-8 mx-auto  display-4">The Journey to the Castle of Preservation</h2>
          <hr>
          <p class="col-md-8 fs-4 mx-auto text-muted">A game about the difference between surviving and being
            understood.
          </p>
          <button class="btn btn-primary btn-lg px-4" id="journey" type="button">Start the Journey</button>
        </div>
      </div>
    </div>
  </main>
  <!-- Landing Page -->
  <script>
    document.getElementById("journey")
  .addEventListener("click", () => {
    // Initialise a new journey.
    localStorage.setItem("health", 0);
    localStorage.setItem("scenarioId", "scenario-00");

    // Open the gameplay page.
    window.location.href = "scenario.html";
});
  </script>

</body>

</html>
