<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css">
  <title>The Forgotten File: The Journey to the Castle of Preservation</title>
</head>

<body>
  <!-- Landing Page -->
  <main class="full-page-bg home-page" id="home">
    <div class="container h-100 d-flex justify-content-center align-items-center">
      
      <!-- Hero -->
      <div class="p-5 mb-4 bg-body-tertiary rounded-3 text-center w-100">
        
        <div class="container-fluid py-5 hero rounded-3">
          <h1 class="display-3 fw-bold">The Forgotten File</h1>
          <h2 class="col-md-8 mx-auto  display-4">The Journey to the Castle of Preservation</h2>
          <hr>
          <p class="col-md-8 fs-4 mx-auto text-muted">A game about the difference between surviving and being
            understood.
          </p>
          <button class="btn btn-primary btn-lg px-4" id="journey" type="button">Start the Journey</button>
        </div>
        <div class="d-flex justify-content-between my-3">
           <a href="gameplay.html" target="_blank" class="btn btn-lg btn-secondary">Gameplay</a>
          <a href="about.html" target="_blank" class="btn btn-lg btn-secondary" >About</a>
          <button class="btn btn-lg btn-secondary" id="music-toggle" aria-pressed="false">Music Off — Click to Enable</button>
        </div>
        
      </div>
    </div>
  </main>
  <!-- Landing Page -->

  <!-- Scenario -->
  <main class="beginning-page full-page-bg d-flex align-items-center d-none" id="scenario">
    <div class="container">
      <div class="row d-flex">
        <div class="col-12 d-flex justify-content-between my-3 rounded-3">
          <button class="btn btn-lg btn-tertiary" id="openMemoryProfileButton">Memory Profile</button>
          <button class="mb-0 btn btn-lg btn-tertiary" id="score">Score: <span id="profile-score">0</span></button>
        </div>
      </div>

      <div class="row">
        <div class="col-12 rounded-3">
          <div class="card h-100">
            <h2 class="card-header px-5" id="chapter"></h2>
            <div class="card-body px-5">
              <h3 class="card-title scenario-title" id="title"></h3>
              <p class="card-text" id="story"></p>
              <hr>
              <div id="choices"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row d-flex">
        <div class="col-12 d-flex justify-content-between rounded-3 my-3">
          <a href="gameplay.html" target="_blank" class="btn btn-lg btn-secondary">Gameplay</a>
          <a href="about.html" target="_blank" class="btn btn-lg btn-secondary" >About</a>
          <button class="btn btn-lg btn-secondary" id="music-toggle" aria-pressed="true">Music On</button>
          <a href="index.html" class="btn btn-lg btn-secondary">Exit</a>
        </div>
      </div>
    </div>
  </main>
  
  <!-- Modal HTML will be loaded here -->
<div id="modal-container"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scenario.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/script.js"></script>

</body>

</html>
