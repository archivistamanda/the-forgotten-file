<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <!-- Scenario -->
  <main class="beginning-page full-page-bg d-flex align-items-center">
    <div class="container">
      <div class="row d-flex">
        <!-- Changed col-auto to col-12 and added d-flex -->
        <div class="col-12 d-flex justify-content-between my-3 rounded-3">
          <button class="btn btn-lg btn-tertiary">Profile</button>
          <p class="mb-0 btn btn-lg btn-tertiary">Score: <span id="profile-score">0</span></p>
        </div>
      </div>

      <div class="row">
        <div class="col-12 rounded-3 mb-5">
          <div class="card h-100">
            <h2 class="card-header px-5" id="chapter"></h2>
            <div class="card-body px-5">
              <h3 class="card-title scenario-title" id="title"></h3>
              <p class="card-text" id="story"></p>
              <hr>
              <div id="choices"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Profile -->
      <!-- <div class="col-lg-4 rounded-3">
          <div class="card h-100">
            <h2 class="card-header">Profile</h2>
            <div class="card-body">
              <p class="card-text">Score: <strong id="profile-score">0</strong></p>
              <p class="card-text">Identity: </p>
              <p class="card-text">Checksum: </p>
              <p class="card-text">File Format: </p>
              <p class="card-text">Format Signature: </p>
              <p class="card-text">Software: </p>
              <p class="card-text">Sensitivity: </p>

            </div>
          </div>
        </div> -->
    </div>
    </div>
  </main>
  <!-- modal -->

  <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="resultModalTitle">
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p id="resultModalBody"></p>
          <h5 id="resultModalScore"></h5>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="modalContinueButton">
            Continue
          </button>
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scenario.js"></script>
  <script src="js/game.js"></script>

</body>

</html>
