<!-- SCORE MODAL -->
  <div class="modal fade" id="scoreModal" tabindex="-1" aria-labelledby="scoreModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h2 class="modal-title" id="scoreModalLabel">
            Your Score
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">

          <!-- TOTAL SCORE -->
          <div class="text-center bg-light rounded p-4 mb-4">
            <p class="text-muted mb-1">Total Score</p>
            <h2 id="totalScore" class="text-primary fw-bold mb-0">0</h2>
          </div>

          <!-- SUBMITTED RESPONSES -->
          <h6 class="fw-bold mb-3">Your Responses</h6>
          <div id="responseList" class="d-flex flex-column gap-2"></div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
            Close
          </button>
        </div>

      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
